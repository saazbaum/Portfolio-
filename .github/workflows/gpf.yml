name: Update GPF NAV
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: gpf
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/gpf.mjs
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add gpf.json
          git diff --cached --quiet || (git commit -m "update gpf" && git pull --rebase -q && git push)
