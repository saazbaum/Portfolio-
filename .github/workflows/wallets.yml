name: Update data
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/wallets.mjs
        env:
          DEBANK_KEY: ${{ secrets.DEBANK_KEY }}
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add wallets.json
          git diff --cached --quiet || (git commit -m "update data" && git pull --rebase -q && git push)
